# Cabinet Ludo — Netlify Configuration
# GitHub repo: christykee/ludo-boardgames
# Auto-deploys from main branch

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

# PDF files served with correct content type
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "inline"

# Pretty URLs
[[redirects]]
  from = "/collection"
  to = "/collection.html"
  status = 200

[[redirects]]
  from = "/heritage"
  to = "/heritage.html"
  status = 200

[[redirects]]
  from = "/editions"
  to = "/editions.html"
  status = 200

[[redirects]]
  from = "/scouting"
  to = "/scouting.html"
  status = 200

[[redirects]]
  from = "/draughts"
  to = "/draughts.html"
  status = 200

[[redirects]]
  from = "/ticket-to-ride"
  to = "/Ticket_to_Ride_All_Versions_Review.html"
  status = 200
